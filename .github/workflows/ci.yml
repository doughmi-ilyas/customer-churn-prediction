name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install pandas==3.0.5 numpy==2.5.1 scikit-learn==1.9.1 imbalanced-learn==0.14.2 joblib==1.6.0 -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile -t churn-app .
      - run: docker build -f docker/Dockerfile.api -t churn-api .
      - name: Smoke test the API container
        run: |
          docker run -d -p 8000:8000 --name api churn-api
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 2; done
          curl -sf localhost:8000/health
